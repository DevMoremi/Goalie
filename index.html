<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Goalie</title>
</head>
<body>
    <main>
        <h1>Your game plan.</h1>
        <p>A little progress goes a long way</p>
        <p id="taskCount"></p>
        <form>
            <input type="text" id="taskInput" placeholder="Task">
            <button id="addTaskButton">Add</button>
        </form>
        <div class="filter-buttons">
            <button id="showAllTasks">All <span id="allTasks"></span></button>
            <button id="showActiveTasks">Active</button>
            <button id="showCompletedTasks">Completed</button>
            
        </div>
        <ul id="task-list"></ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
